<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis: Konten Berbahaya & Cyber Bullying</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 20px 0;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .question-container {
            display: block;
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .option {
            padding: 15px 20px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05rem;
        }
        
        .option:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }
        
        .option.selected {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        
        .option.correct {
            background-color: #d4edda;
            border-color: #28a745;
        }
        
        .option.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
        }
        
        .score-container {
            text-align: center;
            font-size: 1.2rem;
            margin: 15px 0;
            color: #3498db;
            font-weight: 600;
        }
        
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 10px;
            background-color: #3498db;
            width: 10%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        .result-container {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }
        
        .result-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .score-perfect {
            color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        
        .score-low {
            color: #2c3e50;
        }
        
        .final-score {
            font-size: 2rem;
            font-weight: 700;
            margin: 20px 0;
            color: #3498db;
        }
        
        .celebrations {
            margin: 30px 0;
        }
        
        .confetti {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin: 0 5px;
            border-radius: 50%;
            animation: float 3s infinite ease-in-out;
        }
        
        .confetti:nth-child(1) { background-color: #e74c3c; animation-delay: 0s; }
        .confetti:nth-child(2) { background-color: #3498db; animation-delay: 0.3s; }
        .confetti:nth-child(3) { background-color: #2ecc71; animation-delay: 0.6s; }
        .confetti:nth-child(4) { background-color: #f1c40f; animation-delay: 0.9s; }
        .confetti:nth-child(5) { background-color: #9b59b6; animation-delay: 1.2s; }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
            min-width: 200px;
        }
        
        .btn-next {
            background-color: #3498db;
            color: white;
            display: none;
        }
        
        .btn-next:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(41, 128, 185, 0.3);
        }
        
        .btn-restart {
            background-color: #2c3e50;
            color: white;
        }
        
        .btn-restart:hover {
            background-color: #1a252f;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }
        
        .btn-levelup {
            background-color: #2ecc71;
            color: white;
            animation: pulse-green 1.5s infinite;
        }
        
        .btn-levelup:hover {
            background-color: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .correct-feedback {
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
        }
        
        .wrong-feedback {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 5px solid #dc3545;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .question-counter {
            text-align: right;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .question {
                font-size: 1.2rem;
            }
            
            .result-title {
                font-size: 2rem;
            }
            
            .btn {
                min-width: 180px;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kuis: Konten Berbahaya & Cyber Bullying</h1>
        <p class="subtitle">Uji pemahaman Anda tentang ancaman digital dan cara melindungi diri</p>
        
        <div class="question-counter">
            Soal: <span id="current-question">1</span>/10
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="score-container">
            Skor: <span id="score">0</span>/100
        </div>
        
        <div id="quiz-container">
            <!-- Soal dan pilihan ganda akan dimuat di sini oleh JavaScript -->
        </div>
        
        <div class="feedback" id="feedback">
            <!-- Umpan balik untuk jawaban akan ditampilkan di sini -->
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-next" id="next-btn">Lanjut ke Soal Berikutnya</button>
        </div>
    </div>
    
    <div class="container result-container" id="result-container">
        <!-- Hasil akhir akan ditampilkan di sini -->
    </div>

    <script>
        // Data soal kuis berdasarkan artikel
        const quizData = [
            {
                question: "Menurut artikel, apa masalah utama dalam penyebaran konten berbahaya di media sosial?",
                options: [
                    "Kurangnya moderasi konten oleh pengguna",
                    "Cara kerja algoritma yang cenderung mempromosikan konten negatif untuk mempertahankan engagement",
                    "Ketidakmampuan pemerintah dalam mengatur internet",
                    "Rendahnya kesadaran masyarakat tentang keamanan digital"
                ],
                correct: 1,
                feedback: "Benar! Masalah utama bukan hanya keberadaan konten negatif, melainkan cara kerja algoritma media sosial yang cenderung mempromosikan konten negatif tersebut demi mempertahankan perhatian pengguna (engagement)."
            },
            {
                question: "Apa dampak paparan berulang terhadap ujaran kebencian dan konten radikal menurut artikel?",
                options: [
                    "Meningkatkan empati terhadap kelompok lain",
                    "Menormalisasi kebencian, mengurangi empati, dan dalam kasus ekstrem merekrut remaja ke ideologi berbahaya",
                    "Membuat remaja lebih kritis terhadap informasi",
                    "Meningkatkan kemampuan analisis konten media"
                ],
                correct: 1,
                feedback: "Benar! Paparan berulang dapat menormalisasi kebencian, mengurangi empati, dan dalam kasus ekstrem, merekrut remaja ke dalam ideologi berbahaya."
            },
            {
                question: "Apa yang dimaksud dengan misinformasi (hoaks) menurut artikel?",
                options: [
                    "Informasi yang akurat tetapi tidak populer",
                    "Berita palsu dan manipulasi informasi yang sering menyebar lebih cepat daripada fakta",
                    "Informasi teknis yang sulit dipahami",
                    "Konten edukasi yang terlalu sederhana"
                ],
                correct: 1,
                feedback: "Benar! Misinformasi adalah berita palsu dan manipulasi informasi yang sering menyebar lebih cepat daripada fakta, seperti video deepfake atau narasi politik/kesehatan yang dimanipulasi."
            },
            {
                question: "Apa dampak jangka panjang paparan pornografi pada remaja menurut artikel?",
                options: [
                    "Meningkatkan pemahaman tentang hubungan sehat",
                    "Ekspektasi hubungan seksual yang tidak realistis, memandang pasangan sebagai objek, dan gangguan dalam membina hubungan intim yang sehat",
                    "Membantu remaja memahami perubahan tubuhnya",
                    "Mengurangi rasa ingin tahu tentang seksualitas"
                ],
                correct: 1,
                feedback: "Benar! Dampak jangka panjang paparan pornografi meliputi ekspektasi hubungan seksual yang tidak realistis, memandang pasangan sebagai objek, dan gangguan dalam membina hubungan intim yang sehat."
            },
            {
                question: "Apa dampak dari paparan konten kekerasan dan gore menurut artikel?",
                options: [
                    "Meningkatkan keberanian dalam menghadapi situasi berbahaya",
                    "Trauma psikologis, mimpi buruk, kecemasan, dan desensitisasi (menjadi 'kebal' sehingga kekerasan dianggap wajar)",
                    "Membantu memahami realitas dunia yang keras",
                    "Mengajarkan konsekuensi dari kekerasan"
                ],
                correct: 1,
                feedback: "Benar! Dampak konten kekerasan dan gore meliputi trauma psikologis, mimpi buruk, kecemasan, desensitisasi (otak menjadi 'kebal' sehingga kekerasan dianggap wajar), dan menurunnya kepekaan sosial."
            },
            {
                question: "Apa yang dimaksud dengan 'standar kecantikan beracun' menurut artikel?",
                options: [
                    "Standar kecantikan alami yang sehat",
                    "Konten pro-ana (promosi anoreksia), diet ekstrem, dan filter kecantikan tidak realistis di media sosial",
                    "Tips kecantikan tradisional dari nenek moyang",
                    "Rekomendasi produk kecantikan dari dermatolog"
                ],
                correct: 1,
                feedback: "Benar! Standar kecantikan beracun mencakup konten pro-ana (promosi anoreksia), diet ekstrem, dan filter kecantikan tidak realistis di Instagram dan TikTok."
            },
            {
                question: "Mengapa cyberbullying dianggap lebih berbahaya daripada bullying konvensional menurut artikel?",
                options: [
                    "Karena pelakunya selalu diketahui identitasnya",
                    "Karena terjadi 24/7 tanpa henti, meninggalkan jejak digital permanen, dapat viral dengan cepat, dan pelaku dapat anonim",
                    "Karena hanya terjadi di kalangan remaja",
                    "Karena tidak melibatkan kekerasan fisik"
                ],
                correct: 1,
                feedback: "Benar! Cyberbullying lebih berbahaya karena: terjadi 24/7 tanpa henti, meninggalkan jejak digital permanen, dapat viral dengan cepat, dan pelaku dapat bersembunyi di balik anonimitas."
            },
            {
                question: "Apa yang dimaksud dengan 'doxing' sebagai bentuk cyberbullying?",
                options: [
                    "Mengirim pesan ancaman melalui email",
                    "Menyebarkan data pribadi korban (alamat, nomor telepon) tanpa izin",
                    "Membuat akun palsu atas nama korban",
                    "Mengomentari postingan dengan kata-kata kasar"
                ],
                correct: 1,
                feedback: "Benar! Doxing adalah bentuk cyberbullying dengan menyebarkan data pribadi korban (alamat, nomor telepon) tanpa izin."
            },
            {
                question: "Apa dampak jangka panjang dari cyberbullying menurut artikel?",
                options: [
                    "Meningkatkan popularitas di media sosial",
                    "Trauma berkepanjangan (PTSD), keinginan menyakiti diri sendiri (self-harm), dan peningkatan risiko bunuh diri",
                    "Membuat korban lebih tangguh dalam menghadapi kritik",
                    "Mengurangi ketergantungan pada media sosial"
                ],
                correct: 1,
                feedback: "Benar! Dampak jangka panjang cyberbullying meliputi trauma berkepanjangan (PTSD), keinginan menyakiti diri sendiri (self-harm), dan peningkatan risiko bunuh diri."
            },
            {
                question: "Apa yang dimaksud dengan teknik 'Batu Kelabu' sebagai solusi individu menghadapi cyberbullying?",
                options: [
                    "Membalas dengan lebih keras agar pelaku kapok",
                    "Memberikan respons datar tanpa emosi agar pelaku kehilangan minat",
                    "Mengabaikan sepenuhnya tanpa melakukan apa pun",
                    "Melaporkan setiap komentar negatif ke pihak berwajib"
                ],
                correct: 1,
                feedback: "Benar! Teknik 'Batu Kelabu' adalah memberikan respons datar tanpa emosi agar pelaku cyberbullying kehilangan minat untuk terus mengganggu."
            }
        ];

        // Variabel state kuis
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        
        // Elemen DOM
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const nextButton = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score');
        const progressBar = document.getElementById('progress-bar');
        const currentQuestionDisplay = document.getElementById('current-question');
        const feedbackDisplay = document.getElementById('feedback');
        
        // Fungsi untuk menampilkan soal saat ini
        function displayQuestion() {
            // Perbarui counter soal
            currentQuestionDisplay.textContent = currentQuestion + 1;
            
            // Perbarui progress bar
            const progressPercentage = ((currentQuestion + 1) / quizData.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
            
            // Dapatkan soal saat ini
            const questionData = quizData[currentQuestion];
            
            // Buat HTML untuk soal dan pilihan
            let questionHTML = `
                <div class="question-container">
                    <div class="question">${questionData.question}</div>
                    <div class="options">
            `;
            
            // Tambahkan pilihan jawaban
            questionData.options.forEach((option, index) => {
                let optionClass = "option";
                // Jika pengguna sudah memilih jawaban untuk soal ini
                if (userAnswers[currentQuestion] !== null) {
                    if (index === questionData.correct) {
                        optionClass += " correct";
                    } else if (index === userAnswers[currentQuestion] && index !== questionData.correct) {
                        optionClass += " wrong";
                    }
                    if (index === userAnswers[currentQuestion]) {
                        optionClass += " selected";
                    }
                }
                
                questionHTML += `
                    <div class="${optionClass}" data-index="${index}">
                        ${option}
                    </div>
                `;
            });
            
            questionHTML += `</div></div>`;
            
            // Tampilkan soal
            quizContainer.innerHTML = questionHTML;
            
            // Sembunyikan tombol "Lanjut" sampai jawaban dipilih
            nextButton.style.display = 'none';
            
            // Sembunyikan feedback
            feedbackDisplay.style.display = 'none';
            feedbackDisplay.className = 'feedback';
            
            // Jika pengguna sudah memilih jawaban untuk soal ini, tampilkan feedback
            if (userAnswers[currentQuestion] !== null) {
                showFeedback(questionData);
                nextButton.style.display = 'inline-block';
            }
            
            // Tambahkan event listener untuk pilihan
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', selectOption);
            });
        }
        
// Fungsi untuk memilih opsi jawaban
        function selectOption(e) {
            // Hanya izinkan pemilihan jika belum memilih untuk soal ini
            if (userAnswers[currentQuestion] !== null) return;
            
            const selectedOption = e.currentTarget;
            const selectedIndex = parseInt(selectedOption.getAttribute('data-index'));
            
            // Simpan jawaban pengguna
            userAnswers[currentQuestion] = selectedIndex;
            
            // Dapatkan data soal saat ini
            const questionData = quizData[currentQuestion];
            
            // Hitung skor jika jawaban benar
            if (selectedIndex === questionData.correct) {
                score += 10;
                scoreDisplay.textContent = score;
            }
            
            // Tampilkan feedback
            showFeedback(questionData);
            
            // Tampilkan tombol "Lanjut"
            nextButton.style.display = 'inline-block';
            
            // Nonaktifkan semua opsi setelah memilih
            document.querySelectorAll('.option').forEach(option => {
                option.style.pointerEvents = 'none';
            });
        }
        
        // Fungsi untuk menampilkan feedback
        function showFeedback(questionData) {
            const userAnswerIndex = userAnswers[currentQuestion];
            const isCorrect = userAnswerIndex === questionData.correct;
            
            // Tentukan kelas dan teks feedback
            if (isCorrect) {
                feedbackDisplay.className = 'feedback correct-feedback';
            } else {
                feedbackDisplay.className = 'feedback wrong-feedback';
            }
            
            // Tampilkan feedback
            feedbackDisplay.innerHTML = `
                <strong>${isCorrect ? 'Benar!' : 'Salah!'}</strong> ${questionData.feedback}
            `;
            feedbackDisplay.style.display = 'block';
        }
        
        // Fungsi untuk menampilkan soal berikutnya
        function nextQuestion() {
            // Pindah ke soal berikutnya
            currentQuestion++;
            
            // Jika masih ada soal, tampilkan soal berikutnya
            if (currentQuestion < quizData.length) {
                displayQuestion();
            } else {
                // Jika tidak ada soal lagi, tampilkan hasil
                showResult();
            }
        }
        
        // Fungsi untuk menampilkan hasil akhir
        function showResult() {
            // Sembunyikan kontainer kuis
            document.querySelector('.container:first-child').style.display = 'none';
            
            // Tampilkan kontainer hasil
            resultContainer.style.display = 'block';
            
            let resultHTML = '';
            
            // Periksa apakah skor sempurna (100)
            if (score === 100) {
                resultHTML = `
                    <div class="celebrations">
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                        <div class="confetti"></div>
                    </div>
                    <h1 class="result-title score-perfect">KAMU HEBAT!</h1>
                    <p>Selamat! Anda telah menguasai semua konsep tentang konten berbahaya dan cyber bullying dengan sempurna.</p>
                    <div class="final-score">Skor Anda: ${score}/100</div>
                    <p>Anda memahami berbagai ancaman digital dan cara melindungi diri dengan baik.</p>
                    <div style="margin-top: 40px;">
                        <button class="btn btn-levelup" id="levelup-btn">Naik Level</button>
                    </div>
                `;
            } else {
                resultHTML = `
                    <h1 class="result-title score-low">JANGAN MENYERAH! AYO ILANGI!</h1>
                    <div class="final-score">Skor Anda: ${score}/100</div>
                    <p>Anda sudah memahami beberapa konsep, tetapi masih ada ruang untuk meningkatkan pemahaman tentang ancaman digital.</p>
                    <p>Coba lagi untuk memperbaiki skor Anda!</p>
                    <div style="margin-top: 40px;">
                        <button class="btn btn-restart" id="restart-btn">Ilangi</button>
                    </div>
                `;
            }
            
            resultContainer.innerHTML = resultHTML;
            
            // Tambahkan event listener untuk tombol
            if (score === 100) {
                document.getElementById('levelup-btn').addEventListener('click', function() {
                    // Link ke artikel asli
                    window.location.href = 'https://muin123-dr.github.io/HP/007.html';
                });
            } else {
                document.getElementById('restart-btn').addEventListener('click', restartQuiz);
            }
        }
        
        // Fungsi untuk memulai ulang kuis
        function restartQuiz() {
            // Reset state kuis
            currentQuestion = 0;
            score = 0;
            userAnswers.fill(null);
            
            // Reset tampilan skor
            scoreDisplay.textContent = '0';
            
            // Tampilkan kontainer kuis
            document.querySelector('.container:first-child').style.display = 'block';
            
            // Sembunyikan kontainer hasil
            resultContainer.style.display = 'none';
            
            // Tampilkan soal pertama
            displayQuestion();
        }
        
        // Event listener untuk tombol "Lanjut"
        nextButton.addEventListener('click', nextQuestion);
        
        // Tampilkan soal pertama saat halaman dimuat
        displayQuestion();
    </script>
</body>
</html>>
